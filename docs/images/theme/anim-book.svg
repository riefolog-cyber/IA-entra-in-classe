<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <style>
    .page { animation: pageFlip 4s ease-in-out infinite; transform-origin: 100px 80px; }
    .page2 { animation: pageFlip 4s ease-in-out infinite 2s; transform-origin: 100px 80px; }
    .spark { animation: sparkle 2.5s ease-in-out infinite; }
    @keyframes pageFlip { 0%,100% { transform: rotateY(0deg); } 50% { transform: rotateY(15deg); } }
    @keyframes sparkle { 0%,100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
  </style>
  <!-- Book cover -->
  <rect x="30" y="20" width="140" height="120" rx="6" fill="#1f3d33" stroke="#0f2419" stroke-width="2"/>
  <!-- Spine -->
  <rect x="30" y="20" width="12" height="120" rx="3" fill="#0f2419"/>
  <!-- Pages -->
  <g class="page">
    <rect x="45" y="28" width="118" height="104" rx="3" fill="#faf6ee"/>
    <line x1="55" y1="45" x2="150" y2="45" stroke="#c1916b" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="55" x2="140" y2="55" stroke="#9fb28f" stroke-width="1" opacity="0.5"/>
    <line x1="55" y1="65" x2="145" y2="65" stroke="#9fb28f" stroke-width="1" opacity="0.5"/>
    <line x1="55" y1="75" x2="135" y2="75" stroke="#9fb28f" stroke-width="1" opacity="0.5"/>
    <line x1="55" y1="85" x2="148" y2="85" stroke="#9fb28f" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Bookmark -->
  <path d="M155 20 L155 50 L162 43 L169 50 L169 20" fill="#d97757"/>
  <!-- Sparkles -->
  <circle class="spark" cx="175" cy="30" r="3" fill="#f4a261"/>
  <circle class="spark" cx="25" cy="25" r="2" fill="#d97757" style="animation-delay:0.8s"/>
  <circle class="spark" cx="180" cy="130" r="2.5" fill="#5a7a5a" style="animation-delay:1.3s"/>
</svg>
