services:
  - type: web
    name: ia-entra-in-classe
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: bun install && bun run build:web
    startCommand: bun packages/web/src/server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BUN_VERSION
        value: "1.3.14"
      - key: NODE_ENV
        value: production
