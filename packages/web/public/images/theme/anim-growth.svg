<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <style>
    .bar { animation: grow 2s ease-out infinite; transform-origin: bottom; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: 0.2s; } .b3 { animation-delay: 0.4s; }
    .b4 { animation-delay: 0.6s; } .b5 { animation-delay: 0.8s; }
    .line { animation: draw 2s ease-out infinite; stroke-dasharray: 200; stroke-dashoffset: 200; }
    @keyframes grow { 0% { transform: scaleY(0); } 60%,100% { transform: scaleY(1); } }
    @keyframes draw { 0% { stroke-dashoffset: 200; } 60%,100% { stroke-dashoffset: 0; } }
  </style>
  <!-- Grid -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#dce4d3" stroke-width="1"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#dce4d3" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="20" y1="60" x2="180" y2="60" stroke="#dce4d3" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Bars -->
  <rect class="bar b1" x="30" y="90" width="24" height="50" rx="3" fill="#eaf0e3" stroke="#5a7a5a" stroke-width="1.5"/>
  <rect class="bar b2" x="62" y="70" width="24" height="70" rx="3" fill="#f3e7dc" stroke="#d97757" stroke-width="1.5"/>
  <rect class="bar b3" x="94" y="50" width="24" height="90" rx="3" fill="#eaf0e3" stroke="#5a7a5a" stroke-width="1.5"/>
  <rect class="bar b4" x="126" y="35" width="24" height="105" rx="3" fill="#f3e7dc" stroke="#d97757" stroke-width="1.5"/>
  <rect class="bar b5" x="158" y="20" width="24" height="120" rx="3" fill="#1f3d33" stroke="#0f2419" stroke-width="1.5"/>
  <!-- Trend line -->
  <path class="line" d="M42 90 L74 70 L106 50 L138 35 L170 20" stroke="#d97757" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend dots -->
  <circle cx="42" cy="90" r="3" fill="#d97757"/>
  <circle cx="74" cy="70" r="3" fill="#d97757"/>
  <circle cx="106" cy="50" r="3" fill="#d97757"/>
  <circle cx="138" cy="35" r="3" fill="#d97757"/>
  <circle cx="170" cy="20" r="4" fill="#1f3d33" stroke="#f4a261" stroke-width="2"/>
</svg>
