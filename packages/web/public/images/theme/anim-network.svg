<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <style>
    .node { animation: nodePulse 3s ease-in-out infinite; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: 0.4s; } .n3 { animation-delay: 0.8s; }
    .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; }
    .conn { animation: flow 2s linear infinite; stroke-dasharray: 6 4; }
    .conn2 { animation: flow 2.5s linear infinite reverse; stroke-dasharray: 6 4; }
    @keyframes nodePulse { 0%,100% { r: 6; opacity: 0.7; } 50% { r: 9; opacity: 1; } }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -10; } }
  </style>
  <!-- Connections -->
  <line class="conn" x1="50" y1="50" x2="150" y2="100" stroke="#d97757" stroke-width="1.5" opacity="0.5"/>
  <line class="conn2" x1="150" y1="100" x2="250" y2="50" stroke="#5a7a5a" stroke-width="1.5" opacity="0.5"/>
  <line class="conn" x1="50" y1="150" x2="150" y2="100" stroke="#5a7a5a" stroke-width="1.5" opacity="0.5"/>
  <line class="conn2" x1="150" y1="100" x2="250" y2="150" stroke="#d97757" stroke-width="1.5" opacity="0.5"/>
  <line class="conn" x1="50" y1="50" x2="50" y2="150" stroke="#9fb28f" stroke-width="1" opacity="0.3"/>
  <line class="conn2" x1="250" y1="50" x2="250" y2="150" stroke="#9fb28f" stroke-width="1" opacity="0.3"/>
  <!-- Nodes -->
  <circle class="node n1" cx="50" cy="50" r="6" fill="#d97757"/>
  <circle class="node n2" cx="250" cy="50" r="6" fill="#5a7a5a"/>
  <circle class="node n3" cx="50" cy="150" r="6" fill="#5a7a5a"/>
  <circle class="node n4" cx="250" cy="150" r="6" fill="#d97757"/>
  <circle class="node n5" cx="150" cy="100" r="10" fill="#1f3d33"/>
  <circle cx="150" cy="100" r="6" fill="#f4a261"/>
  <!-- Labels -->
  <text x="50" y="35" text-anchor="middle" font-size="9" fill="#5f6b57" font-family="sans-serif">docente</text>
  <text x="250" y="35" text-anchor="middle" font-size="9" fill="#5f6b57" font-family="sans-serif">alunni</text>
  <text x="50" y="175" text-anchor="middle" font-size="9" fill="#5f6b57" font-family="sans-serif">famiglie</text>
  <text x="250" y="175" text-anchor="middle" font-size="9" fill="#5f6b57" font-family="sans-serif">colleghi</text>
  <text x="150" y="125" text-anchor="middle" font-size="9" fill="#faf6ee" font-family="sans-serif" font-weight="bold">IA</text>
</svg>
