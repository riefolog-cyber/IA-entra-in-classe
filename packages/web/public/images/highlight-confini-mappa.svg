<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Anteprima mappa interattiva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#284c3e"/>
      <stop offset="100%" stop-color="#6f9160"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#fff">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640M0 300H640"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360"/>
  </g>
  <g stroke="#eaf2e2" stroke-width="3" fill="none" opacity="0.9">
    <path d="M120 250 C 190 120, 280 120, 320 180 S 470 260, 540 110">
      <animate attributeName="stroke-dasharray" values="0,1200;1200,0;1200,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M150 110 C 240 210, 360 70, 500 220" opacity="0.55">
      <animate attributeName="stroke-dasharray" values="0,900;900,0;900,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g filter="url(#glow)">
    <circle cx="120" cy="250" r="10" fill="#f4e3b2"><animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="180" r="12" fill="#ffffff"><animate attributeName="r" values="10;14;10" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="110" r="10" fill="#f4e3b2"><animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="220" r="8" fill="#d8ebc8"><animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f7f8f2" font-family="Georgia, serif">
    <text x="40" y="52" font-size="30">Mappa interattiva</text>
    <text x="40" y="86" font-size="18" opacity="0.85">I confini morali dell'IA</text>
  </g>
</svg>
